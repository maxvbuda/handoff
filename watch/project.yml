name: ClaudeNotes
options:
  bundleIdPrefix: dev.maxbuda
  deploymentTarget:
    watchOS: "26.0"   # Apple Watch SE 3 ships with watchOS 26: no back-deploy shims
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "4"
    # Size/speed for SE 3 (S10, 40/44mm)
    SWIFT_OPTIMIZATION_LEVEL: -Osize
    SWIFT_COMPILATION_MODE: wholemodule
    GCC_OPTIMIZATION_LEVEL: s
    DEAD_CODE_STRIPPING: YES
    STRIP_INSTALLED_PRODUCT: YES
    STRIP_SWIFT_SYMBOLS: YES
    DEBUG_INFORMATION_FORMAT: dwarf
    ASSETCATALOG_COMPILER_OPTIMIZATION: space
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_PREVIEWS: NO
targets:
  ClaudeNotes:
    type: application
    platform: watchOS
    sources: [ClaudeNotes, Shared]
    dependencies: [{ target: HandOffWidget }] # embedded, for the watch-face complication
    entitlements: # shared with the widget, which shows what the app last saw (Shared/WidgetState.swift)
      path: Support/ClaudeNotes.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.maxbuda.handoff]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxbuda.ClaudeNotes.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Support/Info.plist # Siri's alternative names (Handoff)
        INFOPLIST_KEY_CFBundleDisplayName: Hand-Off
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKApplication: YES
        # Uses only Apple's encryption (CryptoKit, HTTPS), which is exempt; stops App Store Connect asking on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES  # archived inside HandOff, not on its own
        # DEVELOPMENT_TEAM: XXXXXXXXXX  # set yours, or pick it in Xcode > Signing
      configs:
        Debug:
          INFOPLIST_FILE: Support/Debug-Info.plist
  # The watch-face complication, which only opens the app, and the Smart Stack widget, which shows
  # Claude's suggestion and what the chats are doing, as the app saved them in the App Group.
  HandOffWidget:
    type: app-extension
    platform: watchOS
    sources: [HandOffWidget, Shared]
    entitlements:
      path: Support/HandOffWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.maxbuda.handoff]
    info:
      path: HandOffWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION) # must match the app's
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxbuda.ClaudeNotes.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hand-Off
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # The App Store only takes a watch-only app inside an empty iPhone stub
  # (what Xcode's Watch-only App template makes). It has no code; archive this one.
  HandOff:
    type: application.watchapp2-container
    platform: iOS
    sources: []
    dependencies: [{ target: ClaudeNotes }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxbuda.ClaudeNotes
        PRODUCT_NAME: Hand-Off
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hand-Off
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
  ClaudeNotesTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [ClaudeNotesTests]
    dependencies: [{ target: ClaudeNotes }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OPTIMIZATION_LEVEL: -Onone
  ClaudeNotesUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [ClaudeNotesUITests]
    dependencies: [{ target: ClaudeNotes }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ClaudeNotes
schemes:
  ClaudeNotes:
    build:
      targets: { ClaudeNotes: all }
    test:
      config: Debug
      targets: [ClaudeNotesTests, ClaudeNotesUITests]
  HandOff:
    build:
      targets: { HandOff: all }
    archive:
      config: Release
